<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perspective — Utkarsh Kumar Rajput</title>
  <meta name="description" content="Photography and visual perspectives by Utkarsh Kumar Rajput.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .perspective-hero {
      position: relative;
      min-height: 50vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: var(--space-3xl) var(--space-lg) var(--space-xl);
      overflow: hidden;
    }
    
    .perspective-gallery {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 var(--space-lg) var(--space-3xl);
      columns: 1;
      column-gap: var(--space-md);
    }
    
    @media (min-width: 600px) { .perspective-gallery { columns: 2; } }
    @media (min-width: 900px) { .perspective-gallery { columns: 3; } }
    
    .gallery-item {
      break-inside: avoid;
      margin-bottom: var(--space-md);
      position: relative;
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: none;
    }
    
    .gallery-item img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.6s var(--ease-out);
    }

    .gallery-item:hover img {
      transform: scale(1.05);
    }
    
    .gallery-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.4s ease;
      display: flex;
      align-items: flex-end;
      padding: var(--space-sm);
    }
    
    .gallery-item:hover .gallery-overlay {
      opacity: 1;
    }

    .ig-handle {
      color: var(--text-secondary);
      font-size: var(--fs-sm);
      margin-top: var(--space-xs);
    }
    .ig-handle a {
      color: var(--accent);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Custom Cursor -->
  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <!-- Navigation -->
  <nav class="navbar" id="navbar">
    <a href="index.html#hero" class="nav-link" data-cursor="hover">Home</a>
    <a href="index.html#about" class="nav-link" data-cursor="hover">About</a>
    <a href="index.html#experience" class="nav-link" data-cursor="hover">Experience</a>
    <a href="index.html#projects" class="nav-link" data-cursor="hover">Projects</a>
    <a href="index.html#skills" class="nav-link" data-cursor="hover">Skills</a>
    <a href="perspective.html" class="nav-link active" data-cursor="hover">Perspective</a>
    <a href="index.html#contact" class="nav-link" data-cursor="hover">Contact</a>
    <div class="nav-divider"></div>
    <button class="theme-toggle" id="themeToggle" data-cursor="hover" aria-label="Toggle dark/light mode">
      <span class="icon-sun"><i data-lucide="sun" style="width:18px;height:18px"></i></span>
      <span class="icon-moon"><i data-lucide="moon" style="width:18px;height:18px"></i></span>
    </button>
  </nav>

  <!-- Hero -->
  <section class="perspective-hero">
    <h1 class="hero-name reveal" style="font-size: var(--fs-2xl);">Perspective<span class="accent-text">.</span></h1>
    <p class="section-subtitle reveal">Capturing moments, colors, and compositions.</p>
    <p class="ig-handle reveal">Follow on <a href="https://www.instagram.com/utkarshkr13/" target="_blank" data-cursor="hover">@utkarshkr13</a></p>
  </section>

  <!-- Gallery Grid -->
  <section class="perspective-gallery" id="galleryGrid">
    <div class="gallery-item reveal"><img src="assets/profile.jpg" alt="Perspective 1"><div class="gallery-overlay"><i data-lucide="instagram" style="color:#fff;"></i></div></div>
    <div class="gallery-item reveal"><img src="assets/pf-2.jpeg" alt="Perspective 2"><div class="gallery-overlay"><i data-lucide="instagram" style="color:#fff;"></i></div></div>
    <div class="gallery-item reveal"><img src="assets/pf-3.jpeg" alt="Perspective 3"><div class="gallery-overlay"><i data-lucide="instagram" style="color:#fff;"></i></div></div>
    <div class="gallery-item reveal"><img src="assets/pf-4.jpeg" alt="Perspective 4"><div class="gallery-overlay"><i data-lucide="instagram" style="color:#fff;"></i></div></div>
    <div class="gallery-item reveal"><img src="assets/pf-5.jpeg" alt="Perspective 5"><div class="gallery-overlay"><i data-lucide="instagram" style="color:#fff;"></i></div></div>
    <div class="gallery-item reveal"><img src="assets/project-cityflo.png" alt="Perspective 6"><div class="gallery-overlay"><i data-lucide="instagram" style="color:#fff;"></i></div></div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>Designed & Built by <a href="index.html#hero" data-cursor="hover">Utkarsh Kumar Rajput</a> · 2026</p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>

  <script src="js/cursor.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/main.js"></script>
  <script>
    lucide.createIcons();
    // Re-initialize specific reveals for this new page
    gsap.utils.toArray('.reveal').forEach(el => {
      gsap.fromTo(el,
        { y: 40, opacity: 0 },
        {
          scrollTrigger: {
            trigger: el,
            start: "top 85%",
            toggleActions: "play none none reverse"
          },
          y: 0,
          opacity: 1,
          duration: 0.8,
          ease: "power3.out"
        }
      );
    });
  </script>
</body>
</html>
