name: Scheduled News Fetcher (Hyperspace Engine)

on:
  schedule:
    - cron: '0 * * * *' # Every hour
  workflow_dispatch: # Allow manual trigger via UI

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip' # Enable pip caching for faster workflow runs

      - name: Fetch Live Market Data
        run: |
          pip install -r requirements.txt
          python scripts/fetch_market.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add assets/market.json
          git status
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(api): Auto-update live market data"
          git push
